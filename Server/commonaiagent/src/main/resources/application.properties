spring.application.name=common-ai-agent
server.port=8082

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.cloud.config.name=forma
spring.cloud.config.profile=log,eureka,dev
spring.config.import=configserver:http://localhost:8888

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#local LLM configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5-coder:1.5b
spring.ai.ollama.embedding.model=nomic-embed-text:v1.5

#PostgreSQL Vector Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/vector_db
spring.datasource.username=vector_user
spring.datasource.password=${VECTOR_DB_PASSWORD:vector_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# forma.ai.document=${FORMA_AI_DOCUMENT:}

# 3. Spring AI PgVector Store Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

#eureaka server configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
