spring.application.name=common-api-gateway
server.port=8080


spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.server.webflux.routes[0].id=common-user-login
spring.cloud.gateway.server.webflux.routes[0].uri=lb://common-user-login
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/common/user/login/**
